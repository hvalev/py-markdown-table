[project]
name = "py-markdown-table"
version = "1.3.0"
description = "Package that generates markdown tables from a list of dicts"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "hvalev" }]
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/hvalev/py-markdown-table"

[dependency-groups]
dev = [
    "ruff>=0.17,<0.18",
    "pytest>=9.0,<10",
    "pytest-cov>=7.0,<8",
    "mypy>=1.13,<2",
]

[build-system]
requires = ["uv_build>=0.9,<1"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.ruff]
lint.select = ["E", "F", "C", "N", "Q", "B"]
lint.ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
files = ["py_markdown_table"]
# every public and private function is annotated, so make that mean something
disallow_untyped_defs = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
